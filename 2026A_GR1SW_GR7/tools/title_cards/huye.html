<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<style>
  html, body {
    margin: 0; width: 1600px; height: 500px;
    background: transparent;
    overflow: hidden;
  }
  .wrap {
    width: 1600px; height: 500px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(40,0,0,0.2) 0%, rgba(0,0,0,0) 65%);
  }
  h1 {
    font-family: "Times New Roman", Times, serif;
    font-weight: 700;
    font-size: 140px;
    letter-spacing: 0.08em;
    color: #f0c8b0;
    text-shadow:
      0 0 3px #400000,
      0 3px 0 #200808,
      0 0 50px rgba(255,40,20,0.45),
      0 0 100px rgba(180,0,0,0.35);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>¡Huye!</h1>
  </div>
</body>
</html>
