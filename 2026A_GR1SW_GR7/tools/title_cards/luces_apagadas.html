<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
  html, body {
    margin: 0; width: 1600px; height: 500px;
    background: transparent;
    overflow: hidden;
  }
  .wrap {
    width: 1600px; height: 500px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,18,12,0.15) 0%, rgba(0,0,0,0) 70%);
  }
  h1 {
    font-family: "Playfair Display", "Times New Roman", Times, serif;
    font-weight: 700;
    font-size: 92px;
    letter-spacing: 0.12em;
    color: #e8dcc0;
    text-shadow:
      0 0 2px #000,
      0 2px 0 #1a1508,
      0 0 40px rgba(200,160,60,0.25),
      0 0 80px rgba(120,80,20,0.2);
    margin: 0;
    text-transform: none;
    filter: contrast(1.05);
  }
  .sub {
    position: absolute;
    bottom: 90px;
    left: 0; right: 0;
    text-align: center;
    font-family: "Times New Roman", Times, serif;
    font-size: 22px;
    letter-spacing: 0.45em;
    color: rgba(180,160,120,0.55);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Luces Apagadas</h1>
  </div>
  <div class="sub">no hay salida</div>
</body>
</html>
