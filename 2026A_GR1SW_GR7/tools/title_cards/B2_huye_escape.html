<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>B2 — Escapa ahora</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.flash{
  position:fixed;inset:0;background:#3a0000;opacity:0;
  animation: flash 1.1s steps(1) infinite;
}
@keyframes flash{
  0%,88%,100%{opacity:0}
  90%{opacity:.55}
  92%{opacity:0}
  94%{opacity:.35}
}
.grid{
  position:fixed;inset:0;opacity:.07;
  background-image:
    linear-gradient(rgba(255,80,60,.4) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,80,60,.4) 1px, transparent 1px);
  background-size:48px 48px;
  animation: drift 2s linear infinite;
}
@keyframes drift{to{transform:translate(48px,48px)}}
.wrap{
  position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:Impact,"Arial Black","Helvetica Neue",sans-serif;
}
.tag{
  color:#ff4430;font-size:clamp(1rem,2.5vw,1.5rem);letter-spacing:.6em;
  margin-bottom:1rem;animation: pulse 0.35s ease-in-out infinite alternate;
}
@keyframes pulse{from{opacity:.3;transform:scale(0.98)}to{opacity:1;transform:scale(1.02)}}
h1{
  margin:0;font-size:clamp(5.2rem,16vw,11rem);line-height:0.9;
  color:#fff5f0;letter-spacing:.12em;text-transform:uppercase;
  text-shadow:
    0 0 2px #fff,
    0 0 40px #ff2000,
    0 0 90px #a00,
    6px 0 #ff0033,
    -6px 0 #00e5ff;
  animation: slam 0.9s cubic-bezier(.2,.8,.2,1) infinite;
}
@keyframes slam{
  0%,100%{transform:scale(1) translateY(0)}
  40%{transform:scale(1.06) translateY(-4px)}
  55%{transform:scale(0.98) translateY(2px)}
}
.timer{
  margin-top:1.8rem;font-family:"Courier New",monospace;
  color:#ff8866;font-size:clamp(1.2rem,3vw,2rem);letter-spacing:.35em;
  animation: tick 0.5s step-end infinite;
}
@keyframes tick{50%{opacity:.2}}
.frame{
  position:fixed;inset:18px;border:2px solid rgba(255,60,40,.45);
  box-shadow:inset 0 0 60px rgba(255,0,0,.15),0 0 40px rgba(255,0,0,.1);
  pointer-events:none;
}
</style></head>
<body>
<div class="flash"></div><div class="grid"></div><div class="frame"></div>
<div class="wrap">
  <div class="tag">AHORA</div>
  <h1>¡Escapa!</h1>
  <div class="timer">// CORRE //</div>
</div>
</body></html>
