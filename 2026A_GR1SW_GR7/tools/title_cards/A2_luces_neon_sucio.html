<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>A2 Luces</title>
<style>
html,body{margin:0;height:100%;background:#050403;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;overflow:hidden}
.wrap{position:relative;text-align:center;filter:contrast(1.15);padding:1.5rem}
h1{color:#f0d890;font-size:clamp(4.2rem,13vw,9rem);letter-spacing:.14em;margin:0;line-height:1.05;text-shadow:0 0 12px #c9a227,0 0 55px rgba(255,200,50,.4),3px 0 #3a2a00,-3px 0 #1a1000}

</style></head>
<body><div class="noise"></div><div class="wrap"><h1>Luces Apagadas</h1><div class="scan"></div></div></body></html>
