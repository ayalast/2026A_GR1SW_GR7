<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>B4 — Countdown de pánico</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.siren{
  position:fixed;inset:0;
  background:linear-gradient(90deg,#200 0%,#000 40%,#000 60%,#200 100%);
  animation: siren 0.45s linear infinite alternate;
}
@keyframes siren{from{filter:hue-rotate(0deg) brightness(1)}to{filter:hue-rotate(-8deg) brightness(1.3)}}
.ring{
  position:fixed;left:50%;top:50%;width:120vmax;height:120vmax;
  margin:-60vmax;border-radius:50%;
  border:2px solid rgba(255,40,20,.25);
  animation: ring 1.2s ease-out infinite;
}
.ring:nth-child(2){animation-delay:.4s}
.ring:nth-child(3){animation-delay:.8s}
@keyframes ring{
  0%{transform:scale(.15);opacity:.9}
  100%{transform:scale(1);opacity:0}
}
.wrap{
  position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:"Times New Roman",Times,serif;text-align:center;
}
.go{
  color:#ff5030;font-size:clamp(1.1rem,2.8vw,1.6rem);letter-spacing:.7em;
  margin-bottom:.8rem;animation: go 0.25s step-end infinite;
}
@keyframes go{50%{color:#fff;text-shadow:0 0 20px #f00}}
h1{
  margin:0;font-size:clamp(6.5rem,20vw,14rem);font-weight:700;
  color:#fff;line-height:0.9;letter-spacing:.06em;
  text-shadow:
    0 0 10px #ff2000,
    0 0 50px #ff1000,
    0 0 120px #800,
    0 10px 0 #200;
  animation: beat 0.4s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}
.lines{
  margin-top:1.8rem;display:flex;flex-direction:column;gap:.35rem;
  font-family:"Courier New",monospace;color:#ff9a80;
  font-size:clamp(0.95rem,2.2vw,1.35rem);letter-spacing:.25em;
}
.lines span{opacity:.35;animation: line 1.2s step-end infinite}
.lines span:nth-child(1){animation-delay:0s}
.lines span:nth-child(2){animation-delay:.2s}
.lines span:nth-child(3){animation-delay:.4s}
@keyframes line{0%,100%{opacity:.25}30%{opacity:1;color:#fff}}
.blood{
  position:fixed;left:0;right:0;bottom:0;height:28%;
  background:linear-gradient(transparent, rgba(80,0,0,.75));
  pointer-events:none;
}
</style></head>
<body>
<div class="siren"></div>
<div class="ring"></div><div class="ring"></div><div class="ring"></div>
<div class="blood"></div>
<div class="wrap">
  <div class="go">CORRE</div>
  <h1>¡Huye!</h1>
  <div class="lines">
    <span>NO PARES</span>
    <span>NO MIRES</span>
    <span>NO RESPIRRES</span>
  </div>
</div>
</body></html>
